version: 2
updates:
  # Go module dependencies
  - package-ecosystem: "gomod"
    directory: "/"                 # location of go.mod
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Africa/Dar_es_Salaam"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:                        # bundle related updates into one PR
      go-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # major bumps stay as separate PRs so you review them individually

  # GitHub Actions used in your workflows
  - package-ecosystem: "github-actions"
    directory: "/"                 # .github/workflows lives at root
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"