<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Tour preview</title>
<!--
  Print-friendly tour preview. Two render paths per tour:
    1. Composite — when the tour has a cover image AND step
       rects: one screenshot of the page at recording-start with
       every step's numbered badge overlaid. Each badge has a
       hover card surfacing the step's title + text.
    2. Per-step fallback — when those are missing (legacy tours
       recorded before v0.78): the old stacked layout, one
       screenshot per step.

  Three URL shapes work the same way:
    * ?ids=a,b,c          - explicit list to combine
    * ?route=/admin/users - all tours for that route, play order
    * /tours/:id/preview  - legacy single tour
-->
<style>
  :root {
    --ink:#111; --mute:#555; --line:#d4d4d8; --badge:#f59e0b;
    --sub:#a16207; --card-bg:#fff;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; color:var(--ink); font:13px/1.5 system-ui, -apple-system, sans-serif; }
  body { max-width: 1600px; margin: 0 auto; padding: 32px 40px; }

  .cover { margin-bottom: 32px; padding-bottom: 18px; border-bottom: 2px solid var(--line); }
  .cover h1 { margin: 0 0 6px; font-size: 28px; }
  .cover .route { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--mute); font-size: 13px; }
  .cover p { margin: 12px 0 0; color: var(--mute); }
  .cover .tour-pos { display:inline-block; margin-top:6px; color:var(--mute); font-size:12px; }

  /* Composite layout — image in the centre, callout cards in
     dedicated left + right MARGIN columns so they never sit
     over the screenshot content. Each card is vertically
     positioned to match its badge's y position; horizontally
     it lives in the margin nearest its badge. Badges on the
     image stay as numbered pills only — the matching text is
     in the side card. */
  /* Composite — full-width canvas. Cards live INSIDE on top
     of the screenshot, smart-placed per pin by whichever side
     of the target has the most empty space (right/left/below/
     above). SVG connector lines point from each card back to
     its badge so the operator can read direction at a glance.
     Drag handles let the operator nudge any callout if the
     auto-placement landed it awkwardly. */
  .composite-wrap {
    position: relative; margin: 16px 0 24px;
  }
  .composite {
    position: relative;
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
    background: #fff;
  }
  .composite img { display: block; width: 100%; height: 100%; }
  /* Connector lines layer — between image and badges so cards
     float above. Lines redrawn by JS after layout settles. */
  .connectors {
    position: absolute; inset: 0; pointer-events: none; z-index: 4;
  }
  .connectors line {
    stroke: #f59e0b; stroke-width: 1.5;
    stroke-dasharray: 4 3;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.25));
  }
  .callout {
    position: absolute;
    background: var(--card-bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 8px 10px 8px 18px;
    box-shadow: 0 4px 12px rgba(0,0,0,.22);
    font-size: 11px; line-height: 1.4;
    width: 220px; max-width: 28%;
    z-index: 5;
    transition: box-shadow 120ms;
  }
  /* Drag handle — a thin grip along the left edge of every
     callout. cursor: grab signals draggability; the operator
     drags to reposition manually when the auto-placement isn't
     ideal. Position updates the translate offset; release
     latches the new spot. */
  .callout::before {
    content: '⋮⋮';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 14px; display: flex; align-items: center; justify-content: center;
    color: var(--mute); font-size: 10px; letter-spacing: -1px;
    background: var(--line); border-radius: 6px 0 0 6px;
    cursor: grab; user-select: none;
  }
  .callout.dragging { box-shadow: 0 8px 20px rgba(0,0,0,.22); z-index: 10; }
  .callout.dragging::before { cursor: grabbing; }
  .callout .num {
    display: inline-block;
    background: var(--badge); color: var(--ink);
    font: 700 11px/22px system-ui, sans-serif;
    min-width: 22px; height: 22px; padding: 0 6px;
    border-radius: 999px; text-align: center;
    font-variant-numeric: tabular-nums;
    box-sizing: border-box; margin-right: 6px;
    vertical-align: middle;
  }
  .callout.sub .num { background: var(--sub); color: #fff; }
  .callout h4 { display: inline; margin: 0; font-size: 12px; font-weight: 700; vertical-align: middle; }
  /* pre-wrap preserves manual line breaks + indentation the
     operator typed in the inline editor. Without it, runs of
     whitespace collapsed into a single space and the
     formatting that worked at edit-time vanished. */
  .callout p { margin: 4px 0 0; color: #333; white-space: pre-wrap; }

  @media (max-width: 900px) {
    .callout { width: 180px; max-width: 35%; font-size: 10px; }
  }
  @media print {
    /* Print keeps cards + connectors inline; drag grip is
       useless on paper so hide it. */
    .callout::before { display: none; }
    .callout { padding-left: 10px; }
  }
  .pin {
    position: absolute; transform: translate(-50%, -50%);
    z-index: 2; cursor: default;
    display: flex; align-items: center; gap: 6px;
  }
  .pin .badge {
    background: var(--badge); color: var(--ink);
    font: 700 13px/28px system-ui, sans-serif;
    min-width: 28px; height: 28px; padding: 0 8px;
    border-radius: 999px; text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.45);
    display: inline-block; box-sizing: border-box;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .pin.sub .badge { background: var(--sub); color: #fff; }
  /* On-image pins are JUST badges now — the descriptive cards
     live in the side margin columns so they don't overlap
     screenshot content. */
  /* Faint highlight rectangle for the labelled control —
     uses persisted rect_*, scaled to wrapper. We use
     box-shadow inset+outset INSTEAD of outline because:
       1. html2canvas-pro sometimes drops outline (the
          screenshot copied to the clipboard ended up
          without the rectangles around items).
       2. box-shadow is universally captured by both
          html2canvas variants and the browser print engine.
     Inner shadow draws the orange border-effect; the outer
     shadow softens the edge so the rectangle visually
     "sits on" the screenshot rather than cutting into it. */
  /* Highlight rect: real CSS border, NOT box-shadow. The
     previous box-shadow:inset trick is a known html2canvas-pro
     bug — the lib fills the whole element with the shadow
     colour instead of drawing a thin inset stroke, producing
     a solid orange block in clipboard PNGs whenever the
     labelled step pointed at a large container.
     box-sizing:border-box keeps the border from inflating
     the rect away from the target's actual extents. */
  .hi {
    position: absolute; pointer-events: none;
    border: 1.5px solid var(--badge);
    border-radius: 3px;
    background: transparent;
    box-sizing: border-box;
    z-index: 1;
  }

  /* Per-step fallback layout (legacy tours w/o cover image). */
  .step {
    margin: 18px 0; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 8px;
    break-inside: avoid; page-break-inside: avoid;
  }
  .step.sub { background:#fafaf7; border-color:#e7e5e4; margin-left: 28px; }
  .step .head { display:flex; align-items:center; gap:10px; margin-bottom: 6px; }
  .step .head .badge {
    background: var(--badge); color: var(--ink);
    font: 700 13px/28px system-ui, sans-serif;
    min-width: 28px; height: 28px; padding: 0 8px;
    border-radius: 999px; text-align: center;
    display: inline-block; box-sizing: border-box;
    font-variant-numeric: tabular-nums;
  }
  .step.sub .head .badge { background: var(--sub); color: #fff; }
  .step h3 { margin: 0; font-size: 14px; }
  .step .selector { font-family: ui-monospace, monospace; font-size: 11px; color: var(--mute); word-break: break-all; margin-bottom: 6px; }
  .step p { margin: 4px 0 8px; }
  .step .preview img { max-width: 100%; border: 1px solid var(--line); border-radius: 6px; display: block; }

  /* Step list under composite — gives the operator the same
     numbered text reference even when they're looking at the
     composite image. Renders as a clean table for print. */
  .step-list {
    margin: 16px 0 24px; border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden;
  }
  .step-list .row {
    display: grid; grid-template-columns: 44px 1fr; gap: 10px;
    padding: 10px 12px; border-top: 1px solid var(--line); align-items: start;
    break-inside: avoid;
  }
  .step-list .row:first-child { border-top: 0; }
  .step-list .row.sub { background:#fafaf7; padding-left: 32px; }
  .step-list .row .badge {
    background: var(--badge); color: var(--ink);
    font: 700 13px/28px system-ui, sans-serif;
    min-width: 28px; height: 28px; padding: 0 8px;
    border-radius: 999px; text-align: center; display: inline-block; box-sizing: border-box;
    font-variant-numeric: tabular-nums;
  }
  .step-list .row.sub .badge { background: var(--sub); color: #fff; }
  .step-list h4 { margin: 0 0 2px; font-size: 13px; }
  .step-list .selector { font-family: ui-monospace, monospace; font-size: 10px; color: var(--mute); word-break: break-all; }
  /* pre-wrap so operator-typed whitespace (multi-space indents,
     manual newlines) survives display. Matches the clipboard
     HTML's pre-wrap so what they see here matches what lands
     in Word. */
  .step-list p { margin: 4px 0 0; font-size: 12px; color: #333; white-space: pre-wrap; }
  /* Inline edit: any [contenteditable] becomes a click-to-edit
     field. Hover signals editability; focus shows a dashed
     outline so the operator knows they can type. Saved state
     briefly flashes green via .save-flash. */
  [data-edit] { cursor: text; border-radius: 3px; padding: 1px 3px; transition: background 120ms; }
  [data-edit]:hover { background: #fff8e6; }
  [data-edit]:focus { outline: 1px dashed var(--badge); outline-offset: 1px; background: #fff8e6; }
  [data-edit].save-flash { background: #d1fae5; }
  [data-edit].save-error { background: #fee2e2; outline: 1px solid var(--warn); }
  @media print { [data-edit]:hover, [data-edit]:focus { background: transparent; outline: none; } }

  .empty { padding: 24px; color: var(--mute); text-align: center; }

  .toolbar {
    position: sticky; top: 0; background: #fff; padding: 8px 0;
    border-bottom: 1px solid var(--line); margin-bottom: 20px;
    display: flex; gap: 8px; align-items: center; z-index: 10;
  }
  .toolbar button {
    background: #111; color: #fff; border: 0;
    padding: 8px 14px; border-radius: 6px; cursor: pointer;
    font: 13px/1 system-ui, sans-serif;
  }
  .toolbar button.ghost { background: #fff; color: #111; border: 1px solid var(--line); }
  .toolbar .grow { flex: 1; }
  .toolbar .meta { color: var(--mute); font-size: 12px; }

  hr.tour-sep { margin: 32px 0; border: 0; border-top: 1px dashed var(--line); page-break-after: always; }

  /* Print: hide chrome + the hover cards (they're interactive
     and don't make sense in PDF). Layout is page-friendly. */
  @media print {
    body { padding: 0 14mm; max-width: none; }
    .toolbar { display: none; }
    .cover { margin: 12mm 0 8mm; }
    .pin .card { display: none !important; }
    .composite { break-inside: avoid; page-break-inside: avoid; }
    .step-list { break-inside: auto; }
    hr.tour-sep { page-break-after: always; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="empty">Loading…</div>
</div>

<script type="module">
const params = new URLSearchParams(location.search);
const explicitIDs = (params.get('ids') || '').split(',').map(s => s.trim()).filter(Boolean);
const routeFilter = params.get('route') || '';
const pathID = location.pathname.match(/\/tours\/([^/]+)\/preview$/)?.[1] || '';
const singleID = params.get('id') || pathID;

// Preview-side API client. The dashboard SPA carries its own
// copy; we duplicate the two methods the preview needs (upsert
// for inline-edit + merge-scene saves) here so the page is
// self-contained — operators may open the preview URL directly
// without ever touching the dashboard.
const API = {
  upsert(tour) {
    return fetch('/__nexus/tour/tours', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(tour),
    }).then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(new Error(t || `HTTP ${r.status}`))));
  },
};

const escapeHtml = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

// escapeForWord escapes HTML AND preserves whitespace literally:
//   * runs of 2+ spaces → space + (n-1) &nbsp;  so Word can't
//     collapse them on paste (its HTML import strips CSS
//     white-space:pre-wrap in many configurations).
//   * single \n → <br/>; \r\n / \r normalised first.
//   * tab → 4 &nbsp; (Word's default tab stop is wider; the
//     compact 4-space substitution matches what most operator
//     manuals expect to see in numbered lists).
function escapeForWord(s) {
  return escapeHtml(s == null ? '' : s)
    .replace(/\r\n?/g, '\n')
    .replace(/\t/g, '&nbsp;&nbsp;&nbsp;&nbsp;')
    .replace(/  +/g, m => ' ' + '&nbsp;'.repeat(m.length - 1))
    .replace(/\n/g, '<br/>');
}

// flat walks the tree DFS yielding { step, prefix, depth }.
// Every level uses numbers with dot separators: 1, 1.1, 1.2,
// 1.2.1, 2, 2.1 … Restart per parent is preserved so each
// children array starts at 1 again.
function flat(steps, parentPrefix, depth, out) {
  steps.forEach((s, i) => {
    const label = String(i + 1);
    const prefix = parentPrefix ? `${parentPrefix}.${label}` : label;
    out.push({ step: s, prefix, depth });
    if (s.children && s.children.length) flat(s.children, prefix, depth + 1, out);
  });
  return out;
}

// hasComposite reports whether a tour can use the composite
// preview (cover image(s) + at least one step with a stored
// rect). Accepts both the legacy single-cover path (just
// cover_image_url) and the multi-cover path (cover_images[]).
function hasComposite(tour) {
  const haveCover = (tour.cover_images && tour.cover_images.length) || tour.cover_image_url;
  if (!haveCover) return false;
  const flatSteps = flat(tour.steps || [], '', 0, []);
  return flatSteps.some(({ step }) => step.rect_width && step.rect_height);
}

// allCovers returns the list of cover image data-URLs for a
// tour, in capture order. New tours have cover_images[];
// legacy tours fall back to a single-element array built from
// cover_image_url so the multi-cover render path works either
// way.
function allCovers(tour) {
  if (tour.cover_images && tour.cover_images.length) return tour.cover_images;
  if (tour.cover_image_url) return [tour.cover_image_url];
  return [];
}

async function fetchTour(id) {
  const r = await fetch(`/__nexus/tour/tours/${encodeURIComponent(id)}`);
  if (!r.ok) throw new Error(`tour ${id}: HTTP ${r.status}`);
  return r.json();
}

async function resolveTours() {
  if (explicitIDs.length) return Promise.all(explicitIDs.map(fetchTour));
  if (routeFilter) {
    const r = await fetch(`/__nexus/tour/tours?route=${encodeURIComponent(routeFilter)}`);
    if (!r.ok) throw new Error(`list: HTTP ${r.status}`);
    const meta = (await r.json()).tours || [];
    return Promise.all(meta.map(t => fetchTour(t.id)));
  }
  if (singleID) return [await fetchTour(singleID)];
  throw new Error('No tour id / ids / route in URL. Open this page via the dashboard.');
}

// renderOneCover builds a single composite block (one screenshot
// + the steps whose cover_index points at it). renderComposite
// calls this once per cover so dropdown-revealed items can sit
// on the cover that shows the dropdown OPEN instead of trying
// to land on the stale initial screenshot.
function renderOneCover(tour, coverURL, coverIdx, steps) {
  const baseW = tour.base_width  || 1280;
  const baseH = tour.base_height || tour.base_width || 720;
  const pctX = px => (px / baseW) * 100;
  const pctY = px => (px / baseH) * 100;

  // Split steps into left- and right-margin callout columns by
  // their badge's horizontal centre. Each callout's vertical
  // position matches the badge's centre as a % of image height,
  // so the eye traces straight across from card → badge.
  // Per-pin placement: pick the side with most empty space
  // around the target rect. Estimated card footprint = 22% of
  // baseW wide × 8% of baseH tall (matches CSS sizing). We
  // store the chosen anchor as percent coords; the connector
  // SVG draws from card edge → badge centre after layout.
  const CARD_WPCT = 22;
  const CARD_HPCT = 10;
  const CARD_GAP  = 1.5; // %

  function placeCard(step) {
    const lPct = pctX(step.rect_left);
    const tPct = pctY(step.rect_top);
    const wPct = pctX(step.rect_width);
    const hPct = pctY(step.rect_height);
    const rightSpace = 100 - (lPct + wPct);
    const leftSpace  = lPct;
    const belowSpace = 100 - (tPct + hPct);
    const aboveSpace = tPct;
    const candidates = [
      { dir: 'right', space: rightSpace, fits: rightSpace >= CARD_WPCT },
      { dir: 'left',  space: leftSpace,  fits: leftSpace  >= CARD_WPCT },
      { dir: 'below', space: belowSpace, fits: belowSpace >= CARD_HPCT },
      { dir: 'above', space: aboveSpace, fits: aboveSpace >= CARD_HPCT },
    ];
    // Prefer a direction that actually has room; fall back to
    // whichever has most space if nothing fits cleanly.
    const fit = candidates.find(c => c.fits);
    const dir = (fit && fit.dir) || candidates.sort((a, b) => b.space - a.space)[0].dir;
    let left, top;
    switch (dir) {
      case 'right':
        left = lPct + wPct + CARD_GAP;
        top  = Math.max(0.5, Math.min(100 - CARD_HPCT - 0.5, tPct + hPct / 2 - CARD_HPCT / 2));
        break;
      case 'left':
        left = Math.max(0.5, lPct - CARD_WPCT - CARD_GAP);
        top  = Math.max(0.5, Math.min(100 - CARD_HPCT - 0.5, tPct + hPct / 2 - CARD_HPCT / 2));
        break;
      case 'below':
        left = Math.max(0.5, Math.min(100 - CARD_WPCT - 0.5, lPct + wPct / 2 - CARD_WPCT / 2));
        top  = tPct + hPct + CARD_GAP;
        break;
      case 'above':
      default:
        left = Math.max(0.5, Math.min(100 - CARD_WPCT - 0.5, lPct + wPct / 2 - CARD_WPCT / 2));
        top  = Math.max(0.5, tPct - CARD_HPCT - CARD_GAP);
        break;
    }
    return { left, top, dir };
  }

  // Build pins + callouts in two passes. The pin array goes
  // first inside the composite; callouts come after so their
  // z-index naturally stacks above. Connector lines (SVG) are
  // drawn in a JS pass once the DOM is in.
  const itemsByY = steps
    .filter(({ step }) => step.rect_width && step.rect_height)
    .map(it => {
      const cx = it.step.rect_left + it.step.rect_width / 2;
      const cy = it.step.rect_top  + it.step.rect_height / 2;
      return { ...it, cx, cy, placement: placeCard(it.step) };
    });

  // Badges are pinned to the OUTSIDE top-left corner of each
  // highlight rect so they don't sit on top of the target and
  // obscure what's being labelled. translate(-50%, -50%) on
  // the .pin (CSS) centres the badge on the rect's corner, so
  // roughly 3/4 of the pill lives in the margin above-left of
  // the highlight — a clear "this step starts here" anchor.
  const pins = steps.map(({ step, prefix, depth }) => {
    const w = step.rect_width;
    const h = step.rect_height;
    if (!w || !h) return ''; // no rect — list-only step
    return `
      <div class="hi" data-step-id="${escapeHtml(step.id || '')}" style="
        left: ${pctX(step.rect_left)}%;
        top:  ${pctY(step.rect_top)}%;
        width: ${pctX(w)}%;
        height: ${pctY(h)}%;
      "></div>
      <div class="pin ${depth > 0 ? 'sub' : ''}" data-step-id="${escapeHtml(step.id || '')}" style="
        left: ${pctX(step.rect_left)}%;
        top:  ${pctY(step.rect_top)}%;
      ">
        <span class="badge">${escapeHtml(prefix)}</span>
      </div>`;
  }).join('');

  const calloutsHTML = itemsByY.map(({ step, prefix, depth, placement }) => `
    <div class="callout ${depth > 0 ? 'sub' : ''}"
         data-step-id="${escapeHtml(step.id || '')}"
         data-dir="${placement.dir}"
         style="left:${placement.left}%; top:${placement.top}%">
      <span class="num">${escapeHtml(prefix)}</span>
      <h4 data-edit="title" data-tour-id="${escapeHtml(tour.id || '')}" data-step-id="${escapeHtml(step.id || '')}" contenteditable="plaintext-only">${escapeHtml(step.title || step.label || 'Step ' + prefix)}</h4>
      <p data-edit="text" data-tour-id="${escapeHtml(tour.id || '')}" data-step-id="${escapeHtml(step.id || '')}" contenteditable="plaintext-only">${escapeHtml(step.text || '').replace(/\n/g, '<br>') || '<em style="color:#aaa">Click to add description</em>'}</p>
    </div>`).join('');

  // Step list above the composite — labelled walkthrough,
  // then the anchor image. Only the steps that belong to THIS
  // cover (filtered by caller) render in this block.
  return `
    <div class="step-list">
      ${steps.map(({ step, prefix, depth }) => `
        <div class="row ${depth > 0 ? 'sub' : ''}">
          <div><span class="badge">${escapeHtml(prefix)}</span></div>
          <div>
            <h4 data-edit="title" data-tour-id="${escapeHtml(tour.id || '')}" data-step-id="${escapeHtml(step.id || '')}" contenteditable="plaintext-only">${escapeHtml(step.title || step.label || 'Step ' + prefix)}</h4>
            <p data-edit="text" data-tour-id="${escapeHtml(tour.id || '')}" data-step-id="${escapeHtml(step.id || '')}" contenteditable="plaintext-only">${escapeHtml(step.text || '').replace(/\n/g, '<br>') || '<em style="color:#aaa">Click to add description</em>'}</p>
          </div>
        </div>`).join('')}
    </div>
    <div class="composite-wrap">
      <div class="composite" style="aspect-ratio: ${baseW} / ${baseH}">
        <img src="${escapeHtml(coverURL)}" alt="Tour overview ${coverIdx + 1}" />
        <svg class="connectors" preserveAspectRatio="none"></svg>
        ${pins}
        ${calloutsHTML}
      </div>
    </div>`;
}

// renderComposite splits steps by their cover_index and renders
// one full block per cover. The single-cover case (every step
// has cover_index 0, or legacy tours with no field at all)
// collapses naturally — one cover → one block. Tours captured
// with pause-resume across page-state changes show one block
// per state, each with its own step list + screenshot, in
// recording order.
function renderComposite(tour, steps) {
  const covers = allCovers(tour);
  if (!covers.length) return ''; // hasComposite() should've caught this
  // Group: stepsByCover[i] = the items of `steps` whose
  // step.cover_index === i (default 0).
  const stepsByCover = covers.map(() => []);
  for (const item of steps) {
    const i = Number.isInteger(item.step.cover_index) ? item.step.cover_index : 0;
    const safeIdx = Math.max(0, Math.min(covers.length - 1, i));
    stepsByCover[safeIdx].push(item);
  }
  return covers.map((url, i) => {
    if (!stepsByCover[i].length && covers.length > 1) return ''; // skip empty middle covers
    // Header per scene. Scenes after the first get a "merge"
    // button that demotes this scene's steps into substeps of
    // the LAST step in the previous scene. Useful when the
    // captured sequence is logically nested (open dropdown,
    // click item) rather than parallel scenes.
    const mergeBtn = covers.length > 1 && i > 0 && stepsByCover[i].length
      ? `<button class="ghost merge-scene"
                 data-tour-id="${escapeHtml(tour.id || '')}"
                 data-from-cover="${i}"
                 style="margin-left:12px;padding:3px 10px;font-size:11px;color:#374151"
                 title="Pick any step from an earlier scene to attach this scene's steps under as substeps">
           ↳ Merge as substeps of…
         </button>`
      : '';
    const sectionHeader = covers.length > 1
      ? `<h3 style="margin:18px 0 6px;font-size:14px;color:#374151;display:flex;align-items:center;gap:6px">
           Scene ${i + 1} of ${covers.length}${mergeBtn}
         </h3>`
      : '';
    return sectionHeader + renderOneCover(tour, url, i, stepsByCover[i]);
  }).join('');
}

// renderCallouts is retained for backward-compat with any
// callers; new flow renders callouts inline inside the
// composite via calloutsHTML.
function renderCallouts() { return ''; }

function renderFallback(steps) {
  // Selector intentionally omitted from end-user output.
  return steps.map(({ step, prefix, depth }) => `
    <section class="step ${depth > 0 ? 'sub' : ''}">
      <div class="head">
        <span class="badge">${escapeHtml(prefix)}</span>
        <h3>${escapeHtml(step.title || step.label || 'Step ' + prefix)}</h3>
      </div>
      ${step.text ? `<p>${escapeHtml(step.text).replace(/\n/g, '<br>')}</p>` : ''}
      ${step.media_url ? `<div class="preview"><img src="${escapeHtml(step.media_url)}" alt="Step ${escapeHtml(prefix)} screenshot" /></div>` : ''}
    </section>`).join('');
}

function renderTour(tour, tourIdx, tourCount) {
  const steps = flat(tour.steps || [], '', 0, []);
  // For multi-tour previews, attach a per-tour Delete button to
  // the cover header — operators can prune one tour without
  // wiping the whole combined preview. The single-tour case
  // gets its Delete in the toolbar instead so it isn't tucked
  // away below the cover.
  const perTourDelete = tourCount > 1
    ? `<button class="ghost" data-delete-tour="${escapeHtml(tour.id || '')}" style="margin-top:6px;color:#ef4444;border-color:#fecaca;background:#fff;padding:4px 10px;border-radius:6px;font:11px/1 system-ui,sans-serif;cursor:pointer">🗑 Delete this tour</button>`
    : '';
  const cover = `
    <header class="cover">
      <h1>${escapeHtml(tour.name || 'Untitled tour')}</h1>
      ${tour.description ? `<p>${escapeHtml(tour.description)}</p>` : ''}
      ${tourCount > 1 ? `<span class="tour-pos">Tour ${tourIdx + 1} of ${tourCount}</span>` : ''}
      ${perTourDelete}
    </header>`;
  const body = !steps.length
    ? `<div class="empty">This tour has no steps yet.</div>`
    : hasComposite(tour)
      ? renderComposite(tour, steps)
      : renderFallback(steps);
  return `<article class="tour" data-tour-id="${escapeHtml(tour.id || '')}">${cover}${body}</article>`;
}

async function load() {
  let tours;
  try {
    tours = await resolveTours();
  } catch (e) {
    document.getElementById('app').innerHTML = `<div class="empty">Failed to load: ${escapeHtml(e.message)}</div>`;
    return;
  }
  const totalSteps = tours.reduce((n, t) => n + flat(t.steps || [], '', 0, []).length, 0);
  document.title = tours.length === 1
    ? `Preview · ${tours[0].name || tours[0].id}`
    : routeFilter
      ? `Preview · ${tours.length} tours for ${routeFilter}`
      : `Preview · ${tours.length} tours`;

  const toolbar = `
    <div class="toolbar">
      <button onclick="window.print()">Save as PDF</button>
      <button class="ghost" id="copy-clip">📋 Copy for Word</button>
      ${tours.length === 1
        ? `<button class="ghost" id="btn-delete" style="color:#ef4444;border-color:#fecaca">🗑 Delete tour</button>`
        : ''}
      <button class="ghost" id="btn-back">Back</button>
      <span class="grow"></span>
      <span class="meta">${tours.length} tour${tours.length === 1 ? '' : 's'} · ${totalSteps} step${totalSteps === 1 ? '' : 's'}</span>
    </div>`;
  const body = tours.map((t, i) => renderTour(t, i, tours.length))
                    .join('<hr class="tour-sep" />');
  document.getElementById('app').innerHTML = toolbar + body;
  document.getElementById('copy-clip').addEventListener('click', () => copyForWord(tours));
  // Order matters here:
  //   1. enableCalloutDrag — applies any localStorage-saved
  //      positions from prior drags onto each .callout.
  //   2. drawAllConnectors — measures the now-finalised
  //      positions and draws SVG lines.
  //   3. Image onload handlers — re-fire connectors once each
  //      cover image has paint dimensions, since the composite's
  //      aspect-ratio container can shift slightly when the
  //      bitmap arrives.
  //   4. Resize listener — keep lines attached as layout reflows.
  enableCalloutDrag(drawAllConnectors);
  drawAllConnectors();
  document.querySelectorAll('.composite img').forEach(img => {
    if (img.complete) return; // already loaded — drawn above
    img.addEventListener('load', drawAllConnectors, { once: true });
  });
  window.addEventListener('resize', drawAllConnectors);
  const backBtn = document.getElementById('btn-back');
  if (backBtn) backBtn.addEventListener('click', goBack);
  const deleteBtn = document.getElementById('btn-delete');
  if (deleteBtn) deleteBtn.addEventListener('click', () => deleteOneTour(tours[0]));
  // Per-tour delete buttons (multi-tour previews). Click any
  // 🗑 in a tour's header → confirm → DELETE that tour's id
  // → remove the section from the page in place. Last tour
  // deleted falls through to the dashboard.
  document.querySelectorAll('[data-delete-tour]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-delete-tour');
      const t = tours.find(x => x.id === id);
      if (!t) return;
      await deleteOneTour(t, /* inPlace = */ true);
    });
  });
  // Scene-merge buttons: open a picker so the operator can pick
  // WHICH earlier step this scene's contents should become
  // substeps of. The previous version always picked the LAST
  // step of the immediately-preceding scene, which was wrong
  // for tours where the dropdown belongs to a step from much
  // earlier in the flow.
  document.querySelectorAll('.merge-scene').forEach(btn => {
    btn.addEventListener('click', async () => {
      const tourId = btn.getAttribute('data-tour-id');
      const from = Number(btn.getAttribute('data-from-cover'));
      const tour = tours.find(t => t.id === tourId);
      if (!tour) return;
      const target = await pickMergeTarget(tour, from, btn);
      if (!target) return; // operator cancelled
      mergeScene(tour, from, target.stepId);
    });
  });
  // Inline edit: bind blur handlers to every editable element.
  // Tours stay in module scope so the save handler can find the
  // step by id and PUT a fresh tour to the server.
  loadedTours = tours;
  enableInlineEdit();
}

// loadedTours is the hydrated array the page is rendering. The
// inline-edit save handler walks it to update the right step
// (by step.id) before flushing the whole tour to the server.
let loadedTours = [];

// findStepInTour walks the tree DFS and returns the matching
// step object so we can mutate its title/text in place. Returns
// null when the id isn't found (stale edit after the tour was
// deleted from another tab — silently ignored).
function findStepInTour(tour, stepId) {
  if (!tour || !tour.steps) return null;
  const stack = [...tour.steps];
  while (stack.length) {
    const s = stack.shift();
    if (s.id === stepId) return s;
    if (s.children && s.children.length) stack.push(...s.children);
  }
  return null;
}

function enableInlineEdit() {
  document.querySelectorAll('[data-edit]').forEach(el => {
    // Clear the placeholder italic when focused so the operator
    // types over it instead of around it.
    el.addEventListener('focus', () => {
      const ph = el.querySelector('em');
      if (ph) el.textContent = '';
    });
    el.addEventListener('blur', () => saveInlineEdit(el));
    // Enter on a title field commits + blurs (single-line
    // semantics). On a textarea-like p, Shift+Enter inserts
    // a newline; plain Enter commits.
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        el.blur();
      }
    });
  });
}

async function saveInlineEdit(el) {
  const tourId = el.getAttribute('data-tour-id');
  const stepId = el.getAttribute('data-step-id');
  const field  = el.getAttribute('data-edit'); // 'title' or 'text'
  const value  = el.textContent.trim();
  const tour = loadedTours.find(t => t.id === tourId);
  const step = findStepInTour(tour, stepId);
  if (!step) return;
  // No-op when nothing actually changed — avoids a needless
  // round trip every time the operator tabs past a field.
  if ((step[field] || '') === value) return;
  step[field] = value;
  el.classList.remove('save-error', 'save-flash');
  try {
    await API.upsert(tour);
    el.classList.add('save-flash');
    setTimeout(() => el.classList.remove('save-flash'), 800);
  } catch (e) {
    console.error('inline save failed', e);
    el.classList.add('save-error');
  }
}

// pickMergeTarget renders a small popover near the merge button
// listing every step in the tour that comes BEFORE the source
// scene. Operator clicks one to pick it as the parent. Returns
// { stepId } on selection, null on cancel.
//
// We list every candidate (not just root steps) because the
// operator may want to attach a dropdown's contents under a
// SUBSTEP rather than always a root — e.g. "Step 1: Profile
// menu → 1.a: Hover trigger → (merge here): 1.a.i: Click logout".
function pickMergeTarget(tour, fromCover, anchorBtn) {
  return new Promise(resolve => {
    // Gather candidates: every step whose cover_index <
    // fromCover, displayed in DFS order with their existing
    // prefix labels so the operator sees the same numbers
    // they see on the page.
    const all = flat(tour.steps || [], '', 0, []);
    const candidates = all.filter(({ step }) => {
      const ci = Number.isInteger(step.cover_index) ? step.cover_index : 0;
      return ci < fromCover && step.id;
    });
    if (!candidates.length) {
      alert('No earlier steps to attach under. Capture a step in an earlier scene first.');
      resolve(null);
      return;
    }

    // Build the picker. Positioned absolutely below the merge
    // button so it visually anchors to the action that opened it.
    const popover = document.createElement('div');
    popover.style.cssText = `
      position:absolute;
      background:#fff; border:1px solid var(--line);
      border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.18);
      padding:6px; min-width:280px; max-width:380px; max-height:340px;
      overflow:auto; z-index:50;
    `;
    popover.innerHTML = `
      <div style="font-size:11px;color:#888;padding:4px 8px;text-transform:uppercase;letter-spacing:.05em">
        Attach Scene ${fromCover + 1}'s steps under
      </div>` +
      candidates.map(({ step, prefix }) => `
        <button class="pick-target" data-step-id="${escapeHtml(step.id)}"
                style="display:block;width:100%;text-align:left;background:transparent;border:0;padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit;color:#111">
          <span style="display:inline-block;background:#f59e0b;color:#111;font-weight:700;padding:1px 8px;border-radius:999px;font-size:11px;margin-right:6px">${escapeHtml(prefix)}</span>
          ${escapeHtml(step.title || step.label || 'Step ' + prefix)}
        </button>`).join('') +
      `<button class="pick-cancel" style="display:block;width:100%;text-align:center;background:transparent;border:0;padding:6px 10px;margin-top:4px;border-top:1px solid var(--line);border-radius:0 0 6px 6px;cursor:pointer;font:inherit;color:#888">
        Cancel
      </button>`;
    document.body.appendChild(popover);

    // Anchor under the button. getBoundingClientRect is
    // viewport-relative; popover is position:absolute so we
    // add window.scrollY to get page coords.
    const r = anchorBtn.getBoundingClientRect();
    popover.style.left = (r.left + window.scrollX) + 'px';
    popover.style.top  = (r.bottom + window.scrollY + 4) + 'px';

    function close(value) {
      popover.remove();
      document.removeEventListener('keydown', onKey);
      resolve(value);
    }
    function onKey(e) { if (e.key === 'Escape') close(null); }
    document.addEventListener('keydown', onKey);

    popover.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      if (btn.classList.contains('pick-cancel')) return close(null);
      if (btn.classList.contains('pick-target')) {
        close({ stepId: btn.getAttribute('data-step-id') });
      }
    });
    // Click outside the popover cancels.
    setTimeout(() => {
      function outside(e) {
        if (!popover.contains(e.target)) {
          document.removeEventListener('mousedown', outside, true);
          close(null);
        }
      }
      document.addEventListener('mousedown', outside, true);
    }, 0);
  });
}

// mergeScene moves every root-level step from the source scene
// under the target step as substeps. Each moved step keeps its
// own children intact (so a step that already had substeps
// arrives as a 3-deep branch under target).
//
// Why only root-level: a scene is captured as a sequence of
// clicks at the page level — those are the operator's
// "intent" units. If a step somewhere deep also happens to
// carry cover_index === fromCover, it's probably the result
// of an earlier merge and shouldn't be torn out of its
// current parent.
//
// Two-pass implementation kills the bug from the recursive
// walk (a step would get dropped when the target came AFTER
// the source steps in tour.steps — the recursion into target's
// children stomped the freshly-attached movers).
async function mergeScene(tour, fromCover, targetId) {
  if (!tour || !tour.steps || !tour.steps.length || !targetId) return;
  const target = findStepInTour(tour, targetId);
  if (!target) {
    alert('Selected target step no longer exists. Try again.');
    return;
  }

  // Pass 1: split tour.steps into (movers, keepers). A mover is
  // a ROOT step whose cover_index matches fromCover and isn't
  // the target itself. The mover's own .children come along
  // with it untouched.
  const movers = [];
  const keepers = [];
  for (const s of tour.steps) {
    const ci = Number.isInteger(s.cover_index) ? s.cover_index : 0;
    if (ci === fromCover && s.id !== targetId) {
      movers.push(s);
    } else {
      keepers.push(s);
    }
  }
  if (!movers.length) {
    alert(`Scene ${fromCover + 1} has no root-level steps to move.`);
    return;
  }

  const targetLabel = target.title || target.label || 'the selected step';
  if (!confirm(`Move ${movers.length} step${movers.length === 1 ? '' : 's'} from Scene ${fromCover + 1} under "${targetLabel}" as substeps?\n\nEvery step in this scene moves; their own children come along.`)) return;

  // Pass 2: attach every mover to target.children in their
  // original order.
  if (!target.children) target.children = [];
  for (const s of movers) target.children.push(s);
  tour.steps = keepers;

  const btn = document.querySelector(`.merge-scene[data-from-cover="${fromCover}"]`);
  if (btn) { btn.disabled = true; btn.textContent = 'Merging…'; }
  try {
    await API.upsert(tour);
    location.reload();
  } catch (e) {
    alert('Merge failed: ' + (e.message || e));
    if (btn) { btn.disabled = false; btn.textContent = '↳ Merge as substeps of…'; }
  }
}

// deleteOneTour removes a single tour by id. inPlace=true
// (multi-tour preview) strips just that tour's <article> from
// the DOM and leaves the rest in place; inPlace=false (single-
// tour preview) redirects to the dashboard list after delete.
async function deleteOneTour(tour, inPlace) {
  if (!tour || !tour.id) return;
  if (!confirm(`Delete tour "${tour.name || tour.id}"?\n\nThis cannot be undone.`)) return;
  try {
    const r = await fetch(`/__nexus/tour/tours/${encodeURIComponent(tour.id)}`, { method: 'DELETE' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
  } catch (e) {
    alert('Delete failed: ' + (e.message || e));
    return;
  }
  if (inPlace) {
    const article = document.querySelector(`article.tour[data-tour-id="${CSS.escape(tour.id)}"]`);
    if (article) {
      // Also drop the separator <hr> that precedes this article
      // (or trails the last one), so the layout doesn't end
      // with dangling dashed lines.
      const sep = article.previousElementSibling;
      if (sep && sep.classList && sep.classList.contains('tour-sep')) sep.remove();
      const nextSep = article.nextElementSibling;
      if (nextSep && nextSep.classList && nextSep.classList.contains('tour-sep')) nextSep.remove();
      article.remove();
    }
    return;
  }
  // Single-tour preview → dashboard.
  window.location.href = '/__nexus/tour';
}

// goBack handles the Back button. The preview is normally
// opened with window.open(..., '_blank') from the dashboard, so
// the new tab has no useful history (length === 1, only the
// preview URL). In that case window.close() works for tabs the
// script opened. As a final fallback, navigate to the dashboard
// root — at least lands the operator somewhere usable.
function goBack() {
  if (history.length > 1) {
    history.back();
    return;
  }
  // window.close() succeeds for tabs opened via window.open().
  // Browsers silently no-op when the tab wasn't script-opened —
  // detect that by checking after a tick and falling through
  // to dashboard navigation.
  try { window.close(); } catch { /* noop */ }
  setTimeout(() => {
    if (!window.closed) window.location.href = '/__nexus/tour';
  }, 50);
}

// drawAllConnectors walks every .composite on the page,
// matches each callout to its badge by data-step-id, and
// renders an SVG <line> from card edge → badge centre. The
// SVG layer is sized to match the composite via inset:0; we
// use absolute pixel coords inside it (no viewBox) so lines
// stay aligned during resize without re-aspect math.
function drawAllConnectors() {
  document.querySelectorAll('.composite').forEach(comp => {
    const svg = comp.querySelector('svg.connectors');
    if (!svg) return;
    const rect = comp.getBoundingClientRect();
    svg.setAttribute('width', rect.width);
    svg.setAttribute('height', rect.height);
    // Clear + redraw — callout drag fires this too.
    while (svg.firstChild) svg.removeChild(svg.firstChild);
    comp.querySelectorAll('.callout').forEach(card => {
      const id = card.getAttribute('data-step-id');
      const pin = comp.querySelector(`.pin[data-step-id="${CSS.escape(id)}"] .badge`);
      if (!pin) return;
      const cardRect = card.getBoundingClientRect();
      const pinRect  = pin.getBoundingClientRect();
      const px = pinRect.left + pinRect.width / 2 - rect.left;
      const py = pinRect.top  + pinRect.height / 2 - rect.top;
      // Anchor the line at the card edge closest to the pin —
      // gives a clean direct line without overlapping the card body.
      const cardCenterX = cardRect.left + cardRect.width / 2;
      const cardCenterY = cardRect.top  + cardRect.height / 2;
      const dx = px + rect.left - cardCenterX;
      const dy = py + rect.top  - cardCenterY;
      let cx, cy;
      if (Math.abs(dx) > Math.abs(dy)) {
        // Pin is mostly horizontal from card — anchor on left/right edge
        cx = (dx > 0 ? cardRect.right : cardRect.left) - rect.left;
        cy = cardCenterY - rect.top;
      } else {
        cx = cardCenterX - rect.left;
        cy = (dy > 0 ? cardRect.bottom : cardRect.top) - rect.top;
      }
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', cx);
      line.setAttribute('y1', cy);
      line.setAttribute('x2', px);
      line.setAttribute('y2', py);
      svg.appendChild(line);
    });
  });
}

// enableCalloutDrag wires every .callout's left-edge handle to
// pointer events so the operator can reposition cards by hand
// when the auto-placement isn't quite right. The drag delta is
// stored in localStorage keyed by tour id + step id so positions
// survive page reloads.
function enableCalloutDrag(onMove) {
  document.querySelectorAll('.composite').forEach(comp => {
    const callouts = comp.querySelectorAll('.callout');
    callouts.forEach(el => {
      const id = el.getAttribute('data-step-id') || '';
      const key = `tour-callout:${location.pathname}:${location.search}:${id}`;
      // Restore prior position (px offsets layered on top of the
      // base left/top% the auto-placer chose).
      const saved = (() => { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch { return null; } })();
      if (saved && typeof saved.left === 'number') {
        el.style.left = saved.left + '%';
        el.style.top  = saved.top  + '%';
      }

      let startPX = 0, startPY = 0, baseLeftPct = 0, baseTopPct = 0, dragging = false;
      const compRect = () => comp.getBoundingClientRect();

      function onDown(e) {
        const r = el.getBoundingClientRect();
        if (e.clientX - r.left > 18) return; // only the handle area
        e.preventDefault();
        const cr = compRect();
        // Parse current left/top% so resume = where we left off.
        baseLeftPct = parseFloat(el.style.left) || 0;
        baseTopPct  = parseFloat(el.style.top)  || 0;
        startPX = e.clientX; startPY = e.clientY;
        dragging = true;
        el.classList.add('dragging');
        document.addEventListener('pointermove', onDrag);
        document.addEventListener('pointerup', onUp, { once: true });
      }
      function onDrag(e) {
        if (!dragging) return;
        const cr = compRect();
        const dxPct = ((e.clientX - startPX) / cr.width)  * 100;
        const dyPct = ((e.clientY - startPY) / cr.height) * 100;
        el.style.left = (baseLeftPct + dxPct) + '%';
        el.style.top  = (baseTopPct  + dyPct) + '%';
        if (onMove) onMove();
      }
      function onUp() {
        dragging = false;
        el.classList.remove('dragging');
        document.removeEventListener('pointermove', onDrag);
        const final = {
          left: parseFloat(el.style.left),
          top:  parseFloat(el.style.top),
        };
        try { localStorage.setItem(key, JSON.stringify(final)); } catch { /* quota */ }
        if (onMove) onMove();
      }
      el.addEventListener('pointerdown', onDown);
    });
  });
}

// copyForWord puts the tour content on the clipboard as rich
// HTML so the operator can paste straight into Word / Google
// Docs / Outlook. The "image" portion is the composite element
// (cover screenshot + numbered badges + side callouts)
// rendered through html2canvas into a single PNG — preserves
// the visual annotation that on-image badges + side cards
// give in the browser preview.
//
// Clipboard write: writes BOTH text/html (rich body) AND
// text/plain (numbered step list fallback). Word picks
// text/html; raw paste in plain editors falls back to the
// numbered list.
async function copyForWord(tours) {
  const btn = document.getElementById('copy-clip');
  const origLabel = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Capturing…'; }

  try {
    // Render every .composite (one per SCENE — multi-cover
    // tours have multiple) and group the resulting PNGs by
    // tour so multi-scene tours land in the Word doc as
    // multiple labelled figures. Single-scene tours collapse
    // to one figure naturally.
    const h2c = await loadHtml2Canvas();
    const imgsPerTour = []; // string[][] — outer index = tour
    for (const tour of tours) {
      const article = document.querySelector(`article.tour[data-tour-id="${CSS.escape(tour.id || '')}"]`);
      const composites = article ? article.querySelectorAll('.composite') : [];
      const tourImgs = [];
      for (const el of composites) {
        const canvas = await h2c(el, {
          backgroundColor: '#ffffff',
          scale: Math.min(window.devicePixelRatio || 1, 2),
          logging: false,
          useCORS: true,
        });
        tourImgs.push(canvas.toDataURL('image/png'));
      }
      imgsPerTour.push(tourImgs);
    }

    const html = buildClipboardHTML(tours, imgsPerTour);
    const plain = buildClipboardPlain(tours);

    // ClipboardItem with multiple types is the modern way.
    // Some browsers only allow image/png OR text/html, not
    // both — we prefer text/html so the structured layout
    // lands in Word.
    if (navigator.clipboard && window.ClipboardItem) {
      const item = new ClipboardItem({
        'text/html': new Blob([html], { type: 'text/html' }),
        'text/plain': new Blob([plain], { type: 'text/plain' }),
      });
      await navigator.clipboard.write([item]);
    } else {
      // Pre-ClipboardItem fallback (older Firefox): plain only.
      await navigator.clipboard.writeText(plain);
    }
    if (btn) { btn.textContent = '✓ Copied! Paste in Word'; }
  } catch (e) {
    console.error('copy failed', e);
    if (btn) { btn.textContent = '⚠ Copy failed'; }
    alert('Copy failed: ' + (e.message || e) + '\n\nClipboard write requires HTTPS or localhost.');
  } finally {
    if (btn) {
      setTimeout(() => { btn.disabled = false; btn.textContent = origLabel; }, 3000);
    }
  }
}

// loadHtml2Canvas lazily pulls the lib from esm.sh — same
// origin as the in-page agent uses, so the operator's CSP
// allow-list typically already includes it.
let _h2c = null;
async function loadHtml2Canvas() {
  if (_h2c) return _h2c;
  const mod = await import('https://esm.sh/html2canvas-pro@1.5.8');
  _h2c = mod.default || mod;
  return _h2c;
}

// buildClipboardHTML renders the tour(s) as a Word-conformant
// document. Format models the classic technical-manual layout
// (matches the OATS-style admin guides operators are used to):
//
//   <H1>  Tour name (e.g. "Steps to Open User Profile")
//   <p>   route + description (italic grey, optional)
//   <H2>  "Steps"
//   <ol>  1. step text
//         2. step text
//             a. substep text   ← nested ol with lower-alpha
//   <p>   "Figure N: …"   ← centred caption above each screenshot
//   <img> screenshot
//
// All sizing in pt. Arial 12 for body, Arial bold larger for
// headings. Word strips <style> blocks on paste, so every rule
// is inline. Lists use <ol> + start= so step numbering survives
// Word's autocorrect; substeps nest as <ol type="a">.
function buildClipboardHTML(tours, imgsPerTour) {
  const A = 'font-family:Arial, sans-serif';
  // white-space:pre-wrap on text-bearing styles so multi-space
  // indentation + manual line breaks the operator typed in the
  // editor survive into Word. Default white-space:normal
  // collapses runs of whitespace and drops standalone newlines,
  // which made carefully-formatted step descriptions read as
  // one squashed run.
  const body = `${A}; font-size:12pt; color:#000; line-height:1.5`;
  const h1   = `${A}; font-size:18pt; font-weight:bold; margin:18pt 0 6pt; color:#000`;
  const h2   = `${A}; font-size:14pt; font-weight:bold; margin:14pt 0 6pt; color:#000`;
  const meta = `${A}; font-size:11pt; font-style:italic; color:#555; margin:0 0 6pt`;
  const para = `${A}; font-size:12pt; margin:6pt 0; color:#000; white-space:pre-wrap`;
  const li   = `${A}; font-size:12pt; margin:4pt 0; color:#000; white-space:pre-wrap`;
  const cap  = `${A}; font-size:10pt; font-style:italic; color:#444; margin:6pt 0; text-align:center`;

  // renderSteps turns the step tree into ol/li markup. Numbered
  // ol for root steps (1, 2, 3); nested ol[type="a"] for
  // substeps (1.a, 1.b, …) — Word renders that as 'a.' under
  // its parent and joins the prefixes automatically.
  function renderSteps(steps) {
    if (!steps.length) return '';
    // escapeForWord (not escapeHtml) so multi-space indents +
    // newlines survive Word's HTML import. CSS pre-wrap on
    // the <li> styles is the belt; escapeForWord's
    // &nbsp; substitution is the suspenders — Word strips
    // pre-wrap in many configurations.
    return `<ol style="${A}; font-size:12pt; margin:6pt 0 10pt 24pt; color:#000">${
      steps.map(s => {
        const text = (s.text && s.text.trim())
          ? escapeForWord(s.text)
          : escapeForWord(s.title || s.label || '');
        const children = s.children && s.children.length
          ? `<ol style="${A}; font-size:12pt; margin:4pt 0 4pt 18pt; color:#000">${
              s.children.map(c => {
                const ctext = (c.text && c.text.trim())
                  ? escapeForWord(c.text)
                  : escapeForWord(c.title || c.label || '');
                return `<li style="${li}">${ctext}</li>`;
              }).join('')
            }</ol>`
          : '';
        return `<li style="${li}">${text}${children}</li>`;
      }).join('')
    }</ol>`;
  }

  let figureNumber = 0;
  const parts = tours.map((tour, idx) => {
    // Each tour may have multiple scenes (multi-cover) — emit
    // one figure per scene with its own caption. Pre-multi-cover
    // tours collapse to a single figure since the per-tour
    // array only has one entry.
    const tourImgs = (imgsPerTour && imgsPerTour[idx]) || [];
    const figures = tourImgs.map((url, sceneIdx) => {
      figureNumber++;
      const sceneLabel = tourImgs.length > 1
        ? `${escapeHtml(tour.name || 'Tour overview')} — Scene ${sceneIdx + 1} of ${tourImgs.length}`
        : `${escapeHtml(tour.name || 'Tour overview')}`;
      return `<p style="margin:12pt 0 6pt; text-align:center">
           <img src="${url}" style="max-width:100%; border:1pt solid #999"/>
         </p>
         <p style="${cap}">Figure ${figureNumber}: ${sceneLabel}</p>`;
    }).join('');
    const pageBreak = idx < tours.length - 1
      ? `<br clear="all" style="mso-special-character:line-break; page-break-before:always"/>`
      : '';
    // Route intentionally omitted — it's a deploy detail, not
    // part of the user-facing manual. Description carries the
    // human-readable intro that the operator typed at record
    // time.
    const tourPos = tours.length > 1
      ? `<p style="${meta}">Tour ${idx + 1} of ${tours.length}</p>`
      : '';
    return `
      <h1 style="${h1}">${escapeHtml(tour.name || 'Untitled tour')}</h1>
      ${tourPos}
      ${tour.description ? `<p style="${para}">${escapeForWord(tour.description)}</p>` : ''}
      <h2 style="${h2}">Steps</h2>
      ${renderSteps(tour.steps || [])}
      ${figures}
      ${pageBreak}
    `;
  });
  // Word-compatible HTML wrapper. The xmlns + ProgId comment
  // tell Word to treat the fragment as a doc rather than plain
  // HTML when the operator pastes into a fresh document.
  return `<html xmlns:o="urn:schemas-microsoft-com:office:office"
                xmlns:w="urn:schemas-microsoft-com:office:word"
                xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8"/>
<!--[if gte mso 9]><xml>
<w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument>
</xml><![endif]-->
</head>
<body style="${body}">
${parts.join('')}
</body>
</html>`;
}

// buildClipboardPlain mirrors the HTML structure for editors
// that paste text-only (Notepad, Slack, GitHub Markdown):
//
//   Tour Name
//   Route: /login
//   Description...
//   Steps
//     1.  Click the user profile icon or username.
//     2.  Select the Profile option from the dropdown menu.
//          a. (substep)
//
// Letter prefixes for substeps so plaintext output reads the
// same as Word's nested-list rendering.
function buildClipboardPlain(tours) {
  return tours.map((tour, idx) => {
    const head = [
      tour.name || 'Untitled tour',
      tour.description || '',
      tours.length > 1 ? `Tour ${idx + 1} of ${tours.length}` : '',
    ].filter(Boolean).join('\n');
    function renderTextList(steps, parentPrefix) {
      return steps.map((s, i) => {
        // All-numeric numbering at every depth: 1, 1.1, 1.2,
        // 1.2.1 … Matches the HTML preview + Word export.
        const num = parentPrefix
          ? `${parentPrefix}${i + 1}.`
          : `${i + 1}.`;
        const body = (s.text && s.text.trim()) || s.title || s.label || '';
        const indent = parentPrefix ? '      ' : '   ';
        const line = `${indent}${num.padEnd(4)} ${body}`;
        const children = s.children && s.children.length
          ? '\n' + renderTextList(s.children, num)
          : '';
        return line + children;
      }).join('\n');
    }
    return head + '\n\nSteps\n' + renderTextList(tour.steps || [], '');
  }).join('\n\n----\n\n');
}

// downloadAsWord — kept for the .doc fallback path. Same body
// shape as the clipboard HTML but written to a Blob the operator
// downloads, opens with Word, and saves natively as .docx.
function downloadAsWord(tours) {
  function tourBlock(tour, idx) {
    const steps = flat(tour.steps || [], '', 0, []);
    const cover = tour.cover_image_url
      ? `<p><img src="${tour.cover_image_url}" style="max-width:100%; border:1px solid #ccc"/></p>`
      : '';
    const list = steps.map(({ step, prefix, depth }) => {
      const indent = depth * 24;
      const titleText = escapeHtml(step.title || step.label || `Step ${prefix}`);
      const body = step.text ? `<p style="margin:4px 0">${escapeHtml(step.text).replace(/\n/g, '<br>')}</p>` : '';
      return `<div style="margin:10px 0; margin-left:${indent}px">
        <strong style="background:#f59e0b; color:#111; padding:2px 8px; border-radius:999px; font-size:12px">${escapeHtml(prefix)}</strong>
        <strong style="margin-left:8px">${titleText}</strong>
        ${body}
      </div>`;
    }).join('');
    return `
      <h1>${escapeHtml(tour.name || 'Untitled tour')}</h1>
      <p style="color:#666; font-family: Consolas, monospace">${escapeHtml(tour.route || '/')}</p>
      ${tour.description ? `<p>${escapeHtml(tour.description)}</p>` : ''}
      ${tours.length > 1 ? `<p style="color:#888"><em>Tour ${idx + 1} of ${tours.length}</em></p>` : ''}
      ${list}
      ${cover}
      ${idx < tours.length - 1 ? '<br clear="all" style="page-break-before:always" />' : ''}
    `;
  }

  // Wrap as a fake Word HTML doc. The xmlns + ProgId comment
  // are what Word looks at to treat the file as a doc instead
  // of plain HTML. Inline styles only — Word's CSS support is
  // limited to a subset that doesn't include flex/grid.
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office"
                       xmlns:w="urn:schemas-microsoft-com:office:word"
                       xmlns="http://www.w3.org/TR/REC-html40">
<head>
<meta charset="utf-8" />
<title>Tour walkthrough</title>
<!--[if gte mso 9]><xml>
<w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument>
</xml><![endif]-->
<style>
  body { font-family: Calibri, Arial, sans-serif; font-size: 11pt; color: #111; }
  h1 { font-size: 18pt; margin: 14pt 0 6pt; }
  p  { margin: 6pt 0; }
</style>
</head>
<body>
${tours.map(tourBlock).join('')}
</body>
</html>`;

  const blob = new Blob([html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  // Filename based on tour name (single) or count (many).
  const safeName = (tours.length === 1
    ? (tours[0].name || 'tour')
    : `${tours.length}-tours`).replace(/[^a-z0-9-_]+/gi, '_');
  a.download = `${safeName}.doc`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

load();
</script>
</body>
