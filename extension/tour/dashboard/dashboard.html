<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Nexus · Tours</title>
<!--
  The tour plugin's authoring UI. Self-contained — pulls Vue 3
  from esm.sh on first load so the framework doesn't need to
  rebuild the dashboard bundle to surface this page. Talks to
  the plugin's REST endpoints under /__nexus/tour/.

  Operator surface:
    * List every tour + filter by route
    * Inline edit tour-level fields (name, route, description)
    * Tree edit of steps:
        - per-step text (title, text, placement, label)
        - reorder via ↑ ↓ buttons
        - promote / demote across the parent boundary
        - delete (cascades children)
    * Thumbnail preview of each step's screenshot
    * Hard delete of whole tours (with confirm)
-->
<style>
  :root {
    --bg:#f6f7f9; --panel:#fff; --ink:#111; --mute:#6b7280;
    --line:#e5e7eb; --accent:#111; --warn:#ef4444;
    --tag:#f59e0b; --tag-ink:#111;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui, -apple-system, sans-serif; }
  header { background:var(--panel); border-bottom:1px solid var(--line); padding:14px 22px; display:flex; align-items:center; gap:14px; }
  header h1 { margin:0; font-size:18px; }
  header .grow { flex:1; }
  header .filter { padding:6px 10px; border:1px solid var(--line); border-radius:6px; min-width:240px; }
  header button.primary { background:var(--accent); color:#fff; border:0; padding:7px 12px; border-radius:6px; cursor:pointer; }
  main { display:grid; grid-template-columns: 460px 1fr; gap:18px; padding:18px 22px; align-items:flex-start; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  .panel h2 { margin:0; padding:12px 14px; font-size:13px; color:var(--mute); border-bottom:1px solid var(--line); letter-spacing:.05em; text-transform:uppercase; }
  .list { padding:0; margin:0; list-style:none; max-height: calc(100vh - 200px); overflow:auto; }
  .list li { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .list li:last-child { border-bottom:0; }
  .list li:hover { background:#fafafa; }
  .list li.active { background:#eef2ff; border-left:3px solid #4f46e5; padding-left:11px; }
  .list .name { font-weight:600; }
  .list .meta { color:var(--mute); font-size:12px; margin-top:2px; }
  .empty { padding:30px 14px; text-align:center; color:var(--mute); }
  .edit { padding:14px; }
  .edit label { display:block; font-size:12px; color:var(--mute); margin:8px 0 4px; letter-spacing:.02em; }
  .edit input, .edit textarea, .edit select {
    width:100%; padding:6px 8px; font:inherit;
    border:1px solid var(--line); border-radius:6px; background:#fff;
  }
  .edit textarea { min-height:60px; resize:vertical; }
  .edit .actions { margin-top:14px; display:flex; gap:8px; justify-content:flex-end; }
  .edit .actions .danger { color:var(--warn); }
  button { background:#fff; border:1px solid var(--line); padding:6px 10px; border-radius:6px; font:inherit; cursor:pointer; }
  button:hover { background:#fafafa; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--warn); border-color:#fecaca; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .steps { padding:0 14px 14px; }
  .step { background:#fafafa; border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-top:10px; }
  .step.sub { margin-left:24px; border-left:3px solid var(--tag); }
  .step .header { display:flex; align-items:center; gap:8px; }
  .step .badge { background:var(--tag); color:var(--tag-ink); font-weight:700; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .step .label { flex:1; font-weight:600; }
  .step .ctrl button { padding:3px 7px; font-size:12px; }
  .step .selector { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px; color:var(--mute); margin-top:4px; word-break:break-all; }
  .step .grid { display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:8px; }
  .step .grid label { margin-top:0; }
  .step textarea { min-height:50px; }
  .step .preview { margin-top:8px; }
  .step .preview img { max-width:100%; max-height:140px; border:1px solid var(--line); border-radius:6px; cursor:zoom-in; }
  .crumbs { color:var(--mute); font-size:12px; margin:4px 0 0; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#111; color:#fff; padding:10px 14px; border-radius:8px; box-shadow:0 6px 18px rgba(0,0,0,.2); }
  .toast.error { background:var(--warn); }
  dialog.preview-modal { padding:0; border:0; border-radius:10px; max-width:90vw; max-height:90vh; }
  dialog.preview-modal img { max-width:90vw; max-height:90vh; display:block; }
  dialog.preview-modal::backdrop { background:rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { createApp, ref, computed, reactive, onMounted, watch } from 'https://esm.sh/vue@3.4.27/dist/vue.esm-browser.js';

// ============================================================
// API client. Same endpoints the in-page agent uses; thin
// wrappers so the UI doesn't repeat fetch boilerplate.
// ============================================================
const API = {
  list(route) {
    const u = '/__nexus/tour/tours' + (route ? `?route=${encodeURIComponent(route)}` : '');
    return fetch(u).then(r => r.ok ? r.json() : Promise.reject(new Error('list failed'))).then(j => j.tours || []);
  },
  get(id) {
    return fetch(`/__nexus/tour/tours/${encodeURIComponent(id)}`).then(r => r.ok ? r.json() : Promise.reject(new Error('get failed')));
  },
  upsert(tour) {
    return fetch('/__nexus/tour/tours', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(tour),
    }).then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(new Error(t))));
  },
  delete(id) {
    return fetch(`/__nexus/tour/tours/${encodeURIComponent(id)}`, { method:'DELETE' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('delete failed')));
  },
  // reorderTours flushes a new (ids ordering) → the server
  // rewrites each tour's Order field to its position in the slice.
  // Used by the list view's ↑/↓ buttons when a route filter is
  // active (reorder is only meaningful within a single route).
  reorderTours(ids) {
    return fetch('/__nexus/tour/tours/reorder', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ ids }),
    }).then(r => r.ok ? r.json() : Promise.reject(new Error('reorder failed')));
  },
};

// ============================================================
// Helpers: tree traversal.
// stepPath finds an array of indices [i, j, k] from root to the
// step with id `targetId`, so callers can splice the parent
// without recursive predicate functions sprinkled everywhere.
// ============================================================
function stepPath(steps, targetId, acc = []) {
  for (let i = 0; i < steps.length; i++) {
    const s = steps[i];
    if (s.id === targetId) return [...acc, i];
    if (s.children && s.children.length) {
      const found = stepPath(s.children, targetId, [...acc, i]);
      if (found) return found;
    }
  }
  return null;
}
function parentArrayByPath(steps, path) {
  // Return the array containing the node at `path` and the
  // index of that node within it. e.g. path=[0,2,1] → the .children
  // array of steps[0].children[2], and 1.
  let arr = steps;
  for (let i = 0; i < path.length - 1; i++) arr = arr[path[i]].children;
  return { arr, idx: path[path.length - 1] };
}
function flattenTree(steps, out = [], depth = 0, n = { v: 1 }) {
  for (const s of steps) {
    out.push({ step: s, depth, n: n.v++ });
    if (s.children && s.children.length) flattenTree(s.children, out, depth + 1, n);
  }
  return out;
}

// ============================================================
// Root component.
// ============================================================
createApp({
  setup() {
    const tours = ref([]);
    const filter = ref('');
    const loading = ref(false);
    const selectedId = ref(null);
    const editing = ref(null);     // hydrated tour being edited (or null)
    const dirty = ref(false);      // editor has unsaved changes
    const saving = ref(false);
    const toast = ref(null);       // { msg, kind }
    const previewSrc = ref(null);

    function notify(msg, kind) {
      toast.value = { msg, kind };
      setTimeout(() => { if (toast.value && toast.value.msg === msg) toast.value = null; }, 3000);
    }

    async function refresh() {
      loading.value = true;
      try { tours.value = await API.list(filter.value.trim()); }
      catch (e) { notify(e.message || 'load failed', 'error'); }
      finally { loading.value = false; }
    }

    async function selectTour(id) {
      if (dirty.value && !confirm('Discard unsaved changes?')) return;
      selectedId.value = id;
      editing.value = null;
      dirty.value = false;
      try {
        editing.value = await API.get(id);
        if (!editing.value.steps) editing.value.steps = [];
      } catch (e) { notify(e.message || 'load failed', 'error'); }
    }

    function newTour() {
      if (dirty.value && !confirm('Discard unsaved changes?')) return;
      selectedId.value = null;
      editing.value = {
        name: 'New Tour',
        route: filter.value || '/',
        description: '',
        steps: [],
      };
      dirty.value = true;
    }

    async function save() {
      if (!editing.value) return;
      saving.value = true;
      try {
        const saved = await API.upsert(editing.value);
        notify('Saved.');
        dirty.value = false;
        selectedId.value = saved.id;
        editing.value = saved;
        // Refresh list so the new/renamed entry appears.
        await refresh();
      } catch (e) {
        notify(e.message || 'save failed', 'error');
      } finally {
        saving.value = false;
      }
    }

    function openPreview() {
      if (!editing.value || !editing.value.id) return;
      // Open in a new tab so the operator can keep editing while
      // the preview is open + the print dialog lives in its own
      // tab without modal-interrupting the editor.
      window.open(`/__nexus/tour/tours/${encodeURIComponent(editing.value.id)}/preview`, '_blank');
    }

    // openMultiPreview combines tours into one printable page.
    // When a route filter is active, we pre-fill ?route=... so
    // the preview hydrates every tour for that route in play
    // order. Otherwise we pass the ids of everything currently
    // listed.
    function openMultiPreview() {
      if (!tours.value.length) return;
      const params = filter.value.trim()
        ? `route=${encodeURIComponent(filter.value.trim())}`
        : `ids=${tours.value.map(t => encodeURIComponent(t.id)).join(',')}`;
      window.open(`/__nexus/tour/preview?${params}`, '_blank');
    }

    // moveTour shifts a tour up/down within the current list.
    // Only meaningful with a route filter applied — the server
    // accepts the full id sequence and rewrites Order = index.
    async function moveTour(id, delta) {
      const idx = tours.value.findIndex(t => t.id === id);
      if (idx < 0) return;
      const next = idx + delta;
      if (next < 0 || next >= tours.value.length) return;
      const newOrder = [...tours.value];
      const [item] = newOrder.splice(idx, 1);
      newOrder.splice(next, 0, item);
      // Optimistic UI — re-sort first, then flush. A failed
      // server call rolls back via refresh().
      tours.value = newOrder;
      try {
        await API.reorderTours(newOrder.map(t => t.id));
      } catch (e) {
        notify(e.message || 'reorder failed', 'error');
        await refresh();
      }
    }

    async function destroyTour() {
      if (!editing.value || !editing.value.id) return;
      if (!confirm(`Delete tour "${editing.value.name}"?`)) return;
      try {
        await API.delete(editing.value.id);
        editing.value = null;
        selectedId.value = null;
        dirty.value = false;
        await refresh();
        notify('Deleted.');
      } catch (e) { notify(e.message || 'delete failed', 'error'); }
    }

    // ------------- Step operations -------------
    // All operate on editing.value.steps (in-place) then flip
    // dirty=true. Save flushes the whole tour at once via
    // POST /tours, which the store treats as authoritative.

    function markDirty() { dirty.value = true; }

    function deleteStep(id) {
      const path = stepPath(editing.value.steps, id);
      if (!path) return;
      const { arr, idx } = parentArrayByPath(editing.value.steps, path);
      // Reparent children to the deleted step's parent so we
      // don't lose substep work on a wrong click. Mirrors the
      // server's DeleteStep semantics.
      const victim = arr[idx];
      if (victim.children && victim.children.length) {
        arr.splice(idx, 1, ...victim.children);
      } else {
        arr.splice(idx, 1);
      }
      markDirty();
    }

    function moveStep(id, delta) {
      const path = stepPath(editing.value.steps, id);
      if (!path) return;
      const { arr, idx } = parentArrayByPath(editing.value.steps, path);
      const next = idx + delta;
      if (next < 0 || next >= arr.length) return;
      const [item] = arr.splice(idx, 1);
      arr.splice(next, 0, item);
      markDirty();
    }

    function promoteStep(id) {
      // Move a substep up one level. Becomes a sibling of its
      // current parent, inserted right AFTER the parent. No-op
      // for root steps.
      const path = stepPath(editing.value.steps, id);
      if (!path || path.length < 2) return;
      const child = (() => {
        const { arr, idx } = parentArrayByPath(editing.value.steps, path);
        return arr.splice(idx, 1)[0];
      })();
      const parentPath = path.slice(0, -1);
      const { arr: grandArr, idx: parentIdx } = parentArrayByPath(editing.value.steps, parentPath);
      grandArr.splice(parentIdx + 1, 0, child);
      markDirty();
    }

    function demoteStep(id) {
      // Make this step a child of the step immediately above it.
      // No-op for the first step in its array.
      const path = stepPath(editing.value.steps, id);
      if (!path) return;
      const { arr, idx } = parentArrayByPath(editing.value.steps, path);
      if (idx === 0) return;
      const newParent = arr[idx - 1];
      if (!newParent.children) newParent.children = [];
      const [item] = arr.splice(idx, 1);
      newParent.children.push(item);
      markDirty();
    }

    onMounted(refresh);
    watch(filter, () => refresh());

    // flatTree gives the template a single iterable with each
    // node + its visual depth + its 1-based step number, so the
    // template doesn't need to recurse.
    const flatTree = computed(() => editing.value ? flattenTree(editing.value.steps) : []);

    return {
      tours, filter, loading, selectedId, editing, dirty, saving, toast, previewSrc,
      refresh, selectTour, newTour, save, destroyTour, openPreview,
      openMultiPreview, moveTour,
      deleteStep, moveStep, promoteStep, demoteStep, markDirty,
      flatTree,
    };
  },
  template: `
<header>
  <h1>🎬 Tours</h1>
  <span class="grow"></span>
  <input class="filter" v-model="filter" placeholder="filter by route, e.g. /admin/users" />
  <button class="primary" @click="newTour">+ New tour</button>
  <button @click="refresh" :disabled="loading">↻</button>
</header>

<main>
  <section class="panel">
    <h2>
      Tours
      <span style="float:right">
        <button v-if="tours.length >= 1" @click="openMultiPreview" style="padding:2px 8px;font-size:12px"
                :title="filter ? 'Preview every tour for this route in play order' : 'Preview every listed tour combined'">
          📄 {{ tours.length > 1 ? 'Preview all' : 'Preview' }}
        </button>
        <span v-if="tours.length" style="color:#aaa;margin-left:8px">{{ tours.length }}</span>
      </span>
    </h2>
    <ul class="list" v-if="tours.length">
      <li v-for="(t, i) in tours" :key="t.id"
          :class="{ active: t.id === selectedId }"
          @click="selectTour(t.id)">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1;min-width:0">
            <div class="name">
              <span v-if="filter" style="background:#f59e0b;color:#111;font-weight:700;padding:1px 6px;border-radius:999px;font-size:11px;margin-right:6px">{{ i + 1 }}</span>
              {{ t.name || '(unnamed)' }}
            </div>
            <div class="meta">{{ t.route || '/' }} · updated {{ new Date(t.updated_at).toLocaleString() }}</div>
          </div>
          <span v-if="filter" class="ctrl" @click.stop>
            <button :disabled="i === 0" @click="moveTour(t.id, -1)" title="Move up — play earlier" style="padding:3px 7px;font-size:12px">↑</button>
            <button :disabled="i === tours.length - 1" @click="moveTour(t.id, +1)" title="Move down — play later" style="padding:3px 7px;font-size:12px">↓</button>
          </span>
        </div>
      </li>
    </ul>
    <div v-else class="empty">
      <p v-if="loading">Loading…</p>
      <p v-else>No tours yet. Record one via the in-page <strong>● Tour</strong> pill.</p>
    </div>
    <div v-if="!filter && tours.length > 1" class="empty" style="padding:8px 14px;font-size:11px;border-top:1px solid var(--line)">
      💡 Filter by route to reorder which tour plays first.
    </div>
  </section>

  <section v-if="editing" class="panel">
    <h2>
      Editing
      <span v-if="dirty" style="color:#f59e0b;margin-left:8px">● unsaved</span>
    </h2>

    <div class="edit">
      <label>Name</label>
      <input v-model="editing.name" @input="markDirty" />

      <label>Route</label>
      <input v-model="editing.route" @input="markDirty" placeholder="/admin/users" />

      <label>Description</label>
      <textarea v-model="editing.description" @input="markDirty" placeholder="What does this tour show the operator?"></textarea>

      <div class="actions">
        <button v-if="editing.id" class="danger" @click="destroyTour">Delete tour</button>
        <button @click="openPreview"
                :disabled="!editing.id || dirty"
                :title="!editing.id ? 'Save the tour first, then you can preview' : (dirty ? 'Save your changes first to include them in the preview' : 'Open the printable preview in a new tab')">
          📄 Preview PDF
        </button>
        <span style="flex:1"></span>
        <button class="primary" @click="save" :disabled="saving">{{ saving ? 'Saving…' : 'Save' }}</button>
      </div>
    </div>

    <h2>Steps <span style="float:right;color:#aaa">{{ flatTree.length }}</span></h2>
    <div class="steps">
      <div v-if="!flatTree.length" class="empty">
        Record some steps with the in-page agent — they'll appear here for editing.
      </div>
      <div v-for="row in flatTree" :key="row.step.id || row.n"
           class="step"
           :class="{ sub: row.depth > 0 }"
           :style="{ marginLeft: (row.depth * 24) + 'px' }">
        <div class="header">
          <span class="badge">{{ row.n }}</span>
          <span class="label">{{ row.step.label || row.step.title || row.step.selector }}</span>
          <span class="ctrl">
            <button @click="moveStep(row.step.id, -1)" title="Move up">↑</button>
            <button @click="moveStep(row.step.id, +1)" title="Move down">↓</button>
            <button @click="demoteStep(row.step.id)" :disabled="row.depth >= 2" title="Demote (make substep of step above)">→</button>
            <button @click="promoteStep(row.step.id)" :disabled="row.depth === 0" title="Promote (move up one level)">←</button>
            <button class="danger" @click="deleteStep(row.step.id)" title="Delete">×</button>
          </span>
        </div>
        <div class="selector">{{ row.step.selector }}</div>

        <div class="grid">
          <div>
            <label>Title</label>
            <input v-model="row.step.title" @input="markDirty" />
          </div>
          <div>
            <label>Placement</label>
            <select v-model="row.step.placement" @change="markDirty">
              <option value="bottom">bottom</option>
              <option value="top">top</option>
              <option value="left">left</option>
              <option value="right">right</option>
            </select>
          </div>
        </div>

        <label>Text shown to the user</label>
        <textarea v-model="row.step.text" @input="markDirty"
                  placeholder="Explain what this step demonstrates."></textarea>

        <div v-if="row.step.media_url" class="preview">
          <img :src="row.step.media_url" @click="previewSrc = row.step.media_url" />
        </div>
      </div>
    </div>
  </section>

  <section v-else class="panel">
    <h2>Editor</h2>
    <div class="empty">
      <p>Pick a tour from the list, or click <strong>+ New tour</strong> to start a blank one.</p>
    </div>
  </section>
</main>

<div v-if="toast" class="toast" :class="{ error: toast.kind === 'error' }">{{ toast.msg }}</div>

<dialog class="preview-modal"
        ref="previewModal"
        v-bind:open="previewSrc !== null"
        @click="previewSrc = null"
        @keydown.esc="previewSrc = null">
  <img v-if="previewSrc" :src="previewSrc" />
</dialog>
`,
}).mount('#app');
</script>
</body>
</html>
